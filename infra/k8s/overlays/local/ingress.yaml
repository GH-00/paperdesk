apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paperdesk-backend
  namespace: paperdesk
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: paperdesk-backend
                port:
                  number: 80
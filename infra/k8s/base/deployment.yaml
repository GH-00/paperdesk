apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperdesk-backend
  namespace: paperdesk
  labels:
    app.kubernetes.io/name: paperdesk-backend
    app.kubernetes.io/part-of: paperdesk
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: paperdesk-backend
      app.kubernetes.io/part-of: paperdesk
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperdesk-backend
        app.kubernetes.io/part-of: paperdesk
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: paperdesk-backend:dev
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: paperdesk-backend-config
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
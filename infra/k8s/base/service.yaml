apiVersion: v1
kind: Service
metadata:
  name: paperdesk-backend
  namespace: paperdesk
  labels:
    app.kubernetes.io/name: paperdesk-backend
    app.kubernetes.io/part-of: paperdesk
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: paperdesk-backend
    app.kubernetes.io/part-of: paperdesk
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
name: Paperdesk Firmware CI

on:
  pull_request:
    branches:
      - develop
    paths:
      - firmware/**
      - scripts/supply_chain/package_firmware.py
      - .github/workflows/firmware-ci.yml
  push:
    branches:
      - develop
    paths:
      - firmware/**
      - scripts/supply_chain/package_firmware.py
      - .github/workflows/firmware-ci.yml

permissions:
  contents: read

jobs:
  firmware-build:
    name: Firmware build
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ESP-IDF v5.5.5
        uses: espressif/install-esp-idf-action@v1
        with:
          version: v5.5.5

      - name: Build ESP32-S3 firmware
        working-directory: firmware
        run: idf.py build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESP-IDF SBOM tool
        run: python -m pip install "esp-idf-sbom==1.3.1"

      - name: Show ESP-IDF SBOM version
        run: esp-idf-sbom --version

      - name: Generate firmware SBOM
        working-directory: firmware
        run: >-
          esp-idf-sbom create
          --format cyclonedx-json@1.6
          --output-file build/firmware-sbom.cdx.json
          build/project_description.json

      - name: Package firmware release artifact
        run: >-
          python scripts/supply_chain/package_firmware.py
          --build-dir firmware/build
          --output-dir dist/firmware
          --source-sha "$GITHUB_SHA"

      - name: Validate firmware release artifact
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            paperdesk.bin
            bootloader.bin
            partition-table.bin
            flasher_args.json
            flash_args
            project_description.json
            firmware-sbom.cdx.json
            ARTIFACT_METADATA.json
            SHA256SUMS
          )
          for file in "${required_files[@]}"; do
            test -f "dist/firmware/$file"
          done
          cd dist/firmware
          sha256sum --check SHA256SUMS

      - name: Upload firmware release artifact
        uses: actions/upload-artifact@v4
        with:
          name: paperdesk-firmware-${{ github.sha }}
          path: dist/firmware/
          retention-days: 30

  firmware-sign:
    name: Sign and verify firmware checksums
    needs: firmware-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: paperdesk-firmware-${{ github.sha }}
          path: dist/firmware

      - name: Verify firmware package integrity
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/firmware/SHA256SUMS
          cd dist/firmware
          sha256sum --check SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Show Cosign version
        run: cosign version

      - name: Sign firmware checksum manifest
        run: >-
          cosign sign-blob
          --yes
          --bundle dist/firmware/SHA256SUMS.sigstore.json
          dist/firmware/SHA256SUMS

      - name: Verify firmware checksum signature
        env:
          CERTIFICATE_IDENTITY: https://github.com/GH-00/paperdesk/.github/workflows/firmware-ci.yml@refs/heads/develop
          OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: >-
          cosign verify-blob
          dist/firmware/SHA256SUMS
          --bundle dist/firmware/SHA256SUMS.sigstore.json
          --certificate-identity="$CERTIFICATE_IDENTITY"
          --certificate-oidc-issuer="$OIDC_ISSUER"
          --certificate-github-workflow-sha="$GITHUB_SHA"

      - name: Upload firmware signature
        uses: actions/upload-artifact@v4
        with:
          name: paperdesk-firmware-signature-${{ github.sha }}
          path: dist/firmware/SHA256SUMS.sigstore.json
          retention-days: 30

      - name: Report firmware signing
        run: |
          {
            echo "### Firmware signing"
            echo "- Source SHA: ${GITHUB_SHA}"
            echo "- Signed object: SHA256SUMS"
            echo "- Bundle artifact: paperdesk-firmware-signature-${GITHUB_SHA}"
            echo "- Expected workflow identity: https://github.com/GH-00/paperdesk/.github/workflows/firmware-ci.yml@refs/heads/develop"
            echo "- Verification result: passed"
          } >> "$GITHUB_STEP_SUMMARY"
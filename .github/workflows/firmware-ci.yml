name: Paperdesk Firmware CI

on:
  pull_request:
    branches:
      - develop
    paths:
      - firmware/**
      - scripts/supply_chain/package_firmware.py
      - .github/workflows/firmware-ci.yml
  push:
    branches:
      - develop
    paths:
      - firmware/**
      - scripts/supply_chain/package_firmware.py
      - .github/workflows/firmware-ci.yml

permissions:
  contents: read

jobs:
  firmware-build:
    name: Firmware build
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ESP-IDF v5.5.5
        uses: espressif/install-esp-idf-action@v1
        with:
          version: v5.5.5

      - name: Build ESP32-S3 firmware
        working-directory: firmware
        run: idf.py build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESP-IDF SBOM tool
        run: python -m pip install "esp-idf-sbom==1.3.1"

      - name: Show ESP-IDF SBOM version
        run: esp-idf-sbom --version

      - name: Generate firmware SBOM
        working-directory: firmware
        run: >-
          esp-idf-sbom create
          --format cyclonedx-json@1.6
          --output-file build/firmware-sbom.cdx.json
          build/project_description.json

      - name: Package firmware release artifact
        run: >-
          python scripts/supply_chain/package_firmware.py
          --build-dir firmware/build
          --output-dir dist/firmware
          --source-sha "$GITHUB_SHA"

      - name: Validate firmware release artifact
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            paperdesk.bin
            bootloader.bin
            partition-table.bin
            flasher_args.json
            flash_args
            project_description.json
            firmware-sbom.cdx.json
            ARTIFACT_METADATA.json
            SHA256SUMS
          )
          for file in "${required_files[@]}"; do
            test -f "dist/firmware/$file"
          done
          cd dist/firmware
          sha256sum --check SHA256SUMS

      - name: Upload firmware release artifact
        uses: actions/upload-artifact@v4
        with:
          name: paperdesk-firmware-${{ github.sha }}
          path: dist/firmware/
          retention-days: 30
name: Paperdesk Security CI

on:
  pull_request:
    branches:
      - develop
    paths:
      - backend/app/**
      - backend/requirements.txt
      - Dockerfile
      - .dockerignore
      - infra/k8s/**
      - .github/workflows/security-ci.yml
  push:
    branches:
      - develop
    paths:
      - backend/app/**
      - backend/requirements.txt
      - Dockerfile
      - .dockerignore
      - infra/k8s/**
      - .github/workflows/security-ci.yml

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install "semgrep==1.170.0"

      - name: Show Semgrep version
        run: semgrep --version

      - name: Run Semgrep scan
        run: semgrep scan --config=auto --error --metrics=off backend/app

  trivy-repository:
    name: Trivy repository security
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan repository for secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table

      - name: Scan repository configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table

  trivy-image:
    name: Trivy container vulnerability
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build security scan image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          tags: paperdesk-backend:security
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: paperdesk-backend:security
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table